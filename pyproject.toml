[project]
name = "successor"
dynamic = ["version"]
description = "Reads CoinMarketCap migration notices, verifies the successor token against CMC data, returns one verdict with the proving rows."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["fastapi>=0.165,<1", "starlette>=1.10.0", "httpx>=0.28.1,<0.29", "pydantic>=2.14.4,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1.5.0", "pytest-cov>=7.1.0", "respx>=0.23.1", "ruff>=0.7", "mypy>=2.4.1", "pip-audit>=2.7", "uvicorn>=0.32"]
e2e = ["playwright>=1.47"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # the formatter wraps code; long strings and comments stay readable

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["e2e"]  # live-URL browser tests run via `make e2e`, not in the unit run
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools]
packages = ["successor", "successor.agent", "successor.verify"]

[tool.coverage.run]
source = ["successor", "api"]
omit = ["successor/cli.py"]

[tool.coverage.report]
fail_under = 70
show_missing = false

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["successor", "api"]

[tool.setuptools.dynamic]
version = { attr = "successor.__version__" }  # single source of truth; /api/health reads the same value
