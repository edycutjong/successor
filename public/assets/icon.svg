<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Successor — a split-flap tile that has turned to the successor, its lamp green because code verified it against CMC's rows">
  <!-- Successor mark: one split flap from a departure board, settled on the "next" chevron, hinge line across the middle,
       hinge pins at both sides, and the status lamp lit green with a tick (state: verified). Self-plated so it holds on
       GitHub light (#ffffff) and dark (#0d1117). No letterform, no gradient, no glow. -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="var(--bg, #15130F)" stroke="var(--rule, #3A352D)" stroke-width="12"/>
  <!-- flap tile: top half one step lifted, bottom half flap face -->
  <rect x="100" y="112" width="300" height="300" rx="20" fill="var(--flap, #24211C)"/>
  <path d="M120 112h260a20 20 0 0 1 20 20v122H100V132a20 20 0 0 1 20-20z" fill="var(--flap-lift, #2E2A24)"/>
  <!-- the chevron: successor = what comes next (the board's own arrow between OLD and SUCCESSOR) -->
  <path d="M172 158h70l100 104-100 104h-70l100-104z" fill="var(--ink, #EFE9DC)"/>
  <!-- hinge line + pins -->
  <rect x="100" y="254" width="300" height="16" fill="var(--hinge, #0D0C0A)"/>
  <rect x="84" y="244" width="22" height="36" rx="5" fill="var(--rule, #3A352D)"/>
  <rect x="394" y="244" width="22" height="36" rx="5" fill="var(--rule, #3A352D)"/>
  <!-- status lamp: verified -->
  <circle cx="400" cy="112" r="66" fill="var(--bg, #15130F)"/>
  <circle cx="400" cy="112" r="52" fill="var(--after, #5FC27E)"/>
  <path d="M374 113l18 18 34-38" fill="none" stroke="var(--bg, #15130F)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
