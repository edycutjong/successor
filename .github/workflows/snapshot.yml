name: notice-snapshot
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
# one snapshot run at a time (a manual dispatch beside the schedule would race on the push)
concurrency:
  group: notice-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv pip install --system -e .
      - name: deadline freeze (no bot commits after the 2026-12-09 23:59 UTC submission deadline)
        id: gate
        run: echo "open=$([ "$(date -u +%s)" -le 1796860740 ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
      - name: scan top 2000 notices (21 CMC credits)
        if: steps.gate.outputs.open == '1'
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: python scripts/census.py scan
      - name: commit the dated snapshot (data/census.json stays the pinned 2026-11-22 capture the README quotes)
        if: steps.gate.outputs.open == '1'
        run: |
          d=$(date -u +%F)
          mkdir -p data/snapshots
          cp data/census.json "data/snapshots/census-$d.json"
          git checkout -- data/census.json data/notices
          git clean -fdq data/notices
          git config user.name "successor-snapshot"
          git config user.email "snapshot@users.noreply.github.com"
          git add data/snapshots
          git diff --cached --quiet || git commit -m "Nightly notice snapshot $d (data/snapshots/)"
          # main may have moved while the scan ran (a push, or the release job's own commit): replay this one data-only
          # commit on top instead of losing the day's snapshot to a rejected push
          git pull --quiet --rebase origin main
          git push
