name: notice-snapshot
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv pip install --system -e .
      - name: scan top 2000 notices (20 CMC credits)
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: python scripts/census.py scan
      - name: commit the dated snapshot
        run: |
          git config user.name "successor-snapshot"
          git config user.email "snapshot@users.noreply.github.com"
          git add data/census.json data/notices
          git diff --cached --quiet || git commit -m "Nightly notice snapshot $(date -u +%F)"
          git push
