<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Successor — CPOOL flaps turn to CLEAR, three lamps go green, and the status column settles: SELL OLD, +15.7%. Animated mark: the flap stays blank until the lamp lands green, then turns.">
<!-- STORYBOARD (dur 6s — must equal this file's single master dur)
  0-12%   steady state: plate, split flap settled on the chevron, lamp green with a tick (the static icon, poster rule)
  12-48%  trigger:      a new notice is read; the lamp drops to amber and blinks (proposed: the check is running) and the
                        flap turns to BLANK — the board will not show a name it has not verified          data-story="beat-2"
  48-58%  mechanism:    CPOOL flaps turn to CLEAR, three lamps go green, and the status column settles: SELL OLD, +15.7%.
                        (icon form: the lamp lands green with a tick, then the flap clatters dash, bars, dash and lands
                        on the chevron)                                                                   data-story="beat-3"
  58-80%  resolution:   verified state held: chevron on the flap, green lamp                             (residue)
  80-100% breathe + seam: one ripple ring from the lamp at 82%; story layer fades 96-100% onto the identical poster
-->
<style>.pi{transform-box:fill-box;transform-origin:center;animation:pi 6s linear infinite}@keyframes pi{0%,48.32%{transform:scale(.55)}48.33%{transform:scale(.55);animation-timing-function:cubic-bezier(.2,1.4,.4,1)}49.53%{transform:scale(1.16)}50.93%,100%{transform:scale(1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
